services:
  api:
    build: ./backend
    image: qut-competition-api:2.4.0
    container_name: qut-competition-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18086:8000"
    volumes:
      - qut-data:/data
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/notices.db
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  zhcp-api:
    build: ./zhcp
    image: qut-zhcp-api:2.4.0
    container_name: qut-zhcp-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18088:18088"
    volumes:
      - zhcp-files:/data/zhcp-files
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/qut_zhcp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${ZHCP_DB_USER:-pexitong3}
      SPRING_DATASOURCE_PASSWORD: ${ZHCP_DB_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-v4-flash-vision-exp}
      ZHCP_ADMIN_URL: http://38.207.179.218:18089
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  zhcp-ui:
    build: ./zhcp-ui
    image: qut-zhcp-ui:1.0.0
    container_name: qut-zhcp-ui
    restart: unless-stopped
    depends_on:
      - zhcp-api
    ports:
      - "18089:80"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  qut-data:
  zhcp-files:
